quarkus.http.port=8082
quarkus.rabbitmq.devservices.enabled=false
rabbitmq-host=${RABBITMQ_HOST:localhost}
rabbitmq-port=${RABBITMQ_PORT:5672}
rabbitmq-username=${RABBITMQ_USERNAME:profeco}
rabbitmq-password=${RABBITMQ_PASSWORD:REMOVIDO}

mp.messaging.incoming.eventos.connector=smallrye-rabbitmq
mp.messaging.incoming.eventos.queue.name=profeco.eventos
mp.messaging.incoming.eventos.queue.durable=true
mp.messaging.incoming.eventos.exchange.name=profeco.eventos
mp.messaging.incoming.eventos.exchange.type=topic
mp.messaging.incoming.eventos.exchange.durable=true
mp.messaging.incoming.eventos.routing-keys=#
mp.messaging.incoming.eventos.auto-acknowledgement=false
mp.messaging.incoming.eventos.failure-strategy=reject
mp.messaging.incoming.eventos.auto-bind-dlq=true
mp.messaging.incoming.eventos.dlx.declare=true
