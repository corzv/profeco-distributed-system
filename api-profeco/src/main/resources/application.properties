quarkus.http.port=8080

quarkus.datasource.devservices.enabled=false
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/profeco
quarkus.datasource.username=profeco
quarkus.datasource.password=profeco_dev

quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.sql-load-script=import.sql
quarkus.hibernate-orm.log.sql=true

quarkus.rabbitmq.devservices.enabled=false
rabbitmq-host=localhost
rabbitmq-port=5672
rabbitmq-username=profeco
rabbitmq-password=profeco_dev

mp.messaging.outgoing.eventos.connector=smallrye-rabbitmq
mp.messaging.outgoing.eventos.exchange.name=profeco.eventos
mp.messaging.outgoing.eventos.exchange.type=topic
mp.messaging.outgoing.eventos.exchange.durable=true