server {
    listen 80;

    # Api
    location /api/ {
        proxy_pass http://api-profeco:8080/;
    }

    # Notificaciones
    location /notificaciones/ {
        proxy_pass http://notificaciones:8082;

        # SSE
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Demostracion de Abraham
    location / {
        proxy_pass http://notificaciones:8082;
    }
}